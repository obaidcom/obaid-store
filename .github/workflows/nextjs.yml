name: Validate Next.js application
on:
  pull_request:
    branches: [main]
  push:
    branches: ["rebuild/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/obaid_store
          NEXTAUTH_SECRET: ci-only-secret-for-build
          NEXTAUTH_URL: http://localhost:3000
